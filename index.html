<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listing Joueurs — Bowling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#12141c;
    --panel:#1c2030;
    --panel-alt:#242a3d;
    --panel-raised:#2b3148;
    --border:#333a55;
    --amber:#f5a524;
    --amber-dim:#8a6425;
    --red:#d6524a;
    --cream:#f3efe4;
    --muted:#8b92a8;
    --muted-dim:#5c6482;
    --radius:10px;
    --content-max:1320px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(245,165,36,0.08), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(214,82,74,0.06), transparent 35%),
      var(--bg);
    color:var(--cream);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}
  ::selection{background:var(--amber);color:#1c1200;}

  /* ---------- Header ---------- */
  header{
    padding:28px 24px 22px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .header-inner{
    max-width:var(--content-max);
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .pin-icon{width:34px;height:34px;flex:none;}
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-right:auto;
  }
  .brand .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
  }
  .brand h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:.01em;
    margin:0;
    text-transform:uppercase;
  }

  .import-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  .import-btn{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:14px;
    font-weight:600;
    color:#1c1200;
    background:linear-gradient(180deg,#ffc164,var(--amber));
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 2px 0 var(--amber-dim), 0 8px 20px -8px rgba(245,165,36,0.6);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .import-btn:hover{transform:translateY(-1px);}
  .import-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--amber-dim);}
  .import-btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px;}
  .import-btn.secondary{
    color:var(--amber);
    background:transparent;
    border:1px solid var(--amber);
    box-shadow:none;
  }
  .import-btn.secondary:hover{background:rgba(245,165,36,0.1);}
  .import-btn.secondary:active{transform:translateY(1px);}
  #fileInput{display:none;}

  .repo-select{
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--cream);
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    cursor:pointer;
    min-width:200px;
    max-width:280px;
  }
  .repo-select:disabled{opacity:.55;cursor:default;}
  .repo-select:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}

  .file-status{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:10px;
    max-width:var(--content-max);
    margin-left:auto;margin-right:auto;
  }
  .file-status.ok{color:#8fd19e;}
  .file-status.err{color:var(--red);}

  /* ---------- Layout ---------- */
  main{
    max-width:var(--content-max);
    margin:0 auto;
    padding:28px 24px 60px;
  }

  .search-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .search-field{
    flex:1;
    min-width:220px;
    position:relative;
  }
  .search-field-narrow{
    flex:0 1 180px;
    min-width:160px;
  }
  .search-field-btn{
    flex:0 1 200px;
    min-width:170px;
  }
  .search-field-label-spacer{
    display:block;
    font-size:11px;
    margin-bottom:6px;
    visibility:hidden;
  }
  .reset-filters-btn{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:13px;
    font-weight:600;
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    cursor:pointer;
    transition:border-color .12s ease, color .12s ease;
  }
  .reset-filters-btn:hover{border-color:var(--amber);color:var(--amber);}
  .reset-filters-btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
  .search-field label{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  .search-field input,
  .search-field select{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--cream);
    padding:12px 14px;
    border-radius:8px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .search-field select:disabled{cursor:default;opacity:.6;}
  .search-field input::placeholder{color:var(--muted-dim);}
  .search-field input:focus-visible,
  .search-field select:focus-visible{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}

  .content-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    align-items:start;
  }
  @media (min-width:1100px){
    .content-grid{gap:28px;}
  }
  @media (max-width:820px){
    .content-grid{grid-template-columns:1fr;}
  }
  @media (max-width:480px){
    header{padding:20px 16px 16px;}
    .brand h1{font-size:21px;}
    .pin-icon{width:28px;height:28px;}
    main{padding:20px 16px 48px;}
    .import-btn{font-size:13px;padding:11px 16px;}
    .detail-panel{padding:16px;}
    .search-field input{padding:11px 12px;font-size:14px;}
  }

  /* ---------- Results list ---------- */
  .results-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .results-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }
  .results-count{color:var(--amber);}
  .results-list{
    list-style:none;
    margin:0;padding:0;
    max-height:520px;
    overflow-y:auto;
  }
  .results-list li{
    border-bottom:1px solid var(--border);
  }
  .results-list li:last-child{border-bottom:none;}
  .result-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    background:none;
    border:none;
    color:var(--cream);
    text-align:left;
    padding:12px 16px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .result-btn:hover, .result-btn:focus-visible{background:var(--panel-alt);outline:none;}
  .result-btn.active{background:var(--panel-raised);border-left:3px solid var(--amber);}
  .avatar{
    flex:none;
    width:36px;height:36px;
    border-radius:50%;
    background:var(--panel-raised);
    color:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    border:1px solid var(--border);
  }
  .result-text{min-width:0;display:flex;flex-direction:column;gap:2px;}
  .result-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .result-club{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .empty-list{
    padding:36px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }

  /* ---------- Detail panel ---------- */
  .detail-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    min-height:200px;
    position:sticky;
    top:20px;
  }
  .detail-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--muted);
    text-align:center;
    padding:40px 10px;
    font-size:13px;
  }
  .detail-empty svg{width:40px;height:40px;opacity:.5;}

  .detail-header{
    display:flex;
    align-items:center;
    gap:14px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border);
    margin-bottom:16px;
  }
  .avatar-lg{
    flex:none;
    width:54px;height:54px;
    border-radius:50%;
    background:var(--panel-raised);
    color:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:20px;
    border:1px solid var(--border);
  }
  .detail-name{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    font-size:20px;
    font-weight:600;
    letter-spacing:.01em;
  }
  .detail-club{
    font-size:13px;
    color:var(--muted);
    margin-top:2px;
  }

  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media (max-width:420px){.stat-grid{grid-template-columns:1fr;}}
  .stat-row{
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:6px;
    padding:9px 12px;
  }
  .stat-row .k{
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:3px;
  }
  .stat-row .v{
    font-size:13.5px;
    font-weight:500;
    word-break:break-word;
  }
  .stat-row .v-featured{
    color:var(--amber);
    font-weight:700;
    font-family:'Space Mono',monospace;
    font-size:15px;
  }
  .stat-row.wide{
    grid-column:1 / -1;
  }
  .mini-stats{
    display:flex;
    gap:16px;
    margin-top:2px;
    flex-wrap:wrap;
  }
  .mini-stat{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .mini-stat .mk{
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .mini-stat .mv{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:15px;
    color:var(--amber);
  }

  /* ---------- Comparaison entre joueurs ---------- */
  .link-btn{
    background:none;
    border:none;
    color:var(--amber);
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
    padding:6px 0;
  }
  .link-btn:hover{text-decoration:underline;}
  .link-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  .compare-toggle-row{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}

  .compare-panel{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
  .compare-panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .compare-search-input{
    width:100%;
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--cream);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .compare-search-input:focus-visible{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}
  .compare-suggestions{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:4px;
    max-height:220px;
    overflow-y:auto;
  }
  .suggestion-btn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:1px;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:6px;
    padding:8px 10px;
    cursor:pointer;
    text-align:left;
    color:var(--cream);
    font-family:'Inter',sans-serif;
    width:100%;
  }
  .suggestion-btn:hover, .suggestion-btn:focus-visible{background:var(--panel-raised);outline:none;}
  .suggestion-name{font-size:13px;font-weight:600;}
  .suggestion-club{font-size:11px;color:var(--muted);}
  .suggestion-empty{font-size:12px;color:var(--muted);padding:6px 2px;}

  .compare-players{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .compare-player{display:flex;align-items:center;gap:10px;min-width:0;}
  .compare-player .detail-name{font-size:15px;}
  .compare-vs{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    color:var(--muted);
    font-size:12px;
    letter-spacing:.12em;
  }

  .compare-table-scroll{overflow-x:auto;}
  .compare-table{width:100%;border-collapse:collapse;font-size:13px;}
  .compare-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  .compare-table td.ck{
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
    width:1%;
  }
  .compare-table td.cv{color:var(--cream);}
  .compare-table tr.compare-highlight td.cv{
    color:var(--amber);
    font-weight:700;
    font-family:'Space Mono',monospace;
  }
  .compare-actions{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;}

  @media (max-width:480px){
    .compare-players{flex-direction:column;gap:8px;}
  }

  .page-credit{
    text-align:center;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--muted-dim);
    padding:0 24px 28px;
  }

</style>
</head>
<body>

<header>
  <div class="header-inner">
    <svg class="pin-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C10.5 2 9.6 3.6 10 5c.3 1 .2 1.6-.3 2.4C8.6 9 8 10.8 8 13c0 1.3.4 2 .4 3.2 0 1-.4 1.6-1 2.6-.5.9-.9 1.7-.9 2.6C6.5 22.8 8.4 23.5 12 23.5s5.5-.7 5.5-1.6c0-.9-.4-1.7-.9-2.6-.6-1-1-1.6-1-2.6 0-1.2.4-1.9.4-3.2 0-2.2-.6-4-1.7-5.6-.5-.8-.6-1.4-.3-2.4.4-1.4-.5-3-2-3Z" stroke="#f5a524" stroke-width="1.4"/>
      <ellipse cx="12" cy="6.2" rx="1.6" ry="1.1" stroke="#f5a524" stroke-width="1"/>
    </svg>
    <div class="brand">
      <span class="eyebrow">Bowling</span>
      <h1>Listing Joueurs</h1>
    </div>
    <div class="import-actions">
      <button class="import-btn" id="importBtn" type="button">Importer un listing (xlsx)</button>
      <select class="repo-select" id="listingSelect" disabled>
        <option value="">Recherche des listings…</option>
      </select>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
  </div>
  <p class="file-status" id="fileStatus">Recherche du dernier listing dans le dépôt…</p>
</header>

<main>

  <div class="search-row">
    <div class="search-field">
      <label for="nameSearch">Rechercher un joueur</label>
      <input type="text" id="nameSearch" placeholder="Nom du joueur…" disabled>
    </div>
    <div class="search-field">
      <label for="clubSearch">Filtrer par club</label>
      <input type="text" id="clubSearch" placeholder="Nom du club…" list="clubList" disabled>
      <datalist id="clubList"></datalist>
    </div>
    <div class="search-field search-field-narrow">
      <label for="categorySearch">Niveau</label>
      <select id="categorySearch" disabled>
        <option value="">Tous niveaux</option>
        <option value="Elite">Elite</option>
        <option value="Excellence">Excellence</option>
        <option value="Honneur">Honneur</option>
      </select>
    </div>
    <div class="search-field search-field-btn">
      <span class="search-field-label-spacer" aria-hidden="true">&nbsp;</span>
      <button type="button" id="resetFiltersBtn" class="reset-filters-btn">Réinitialiser les filtres</button>
    </div>
  </div>

  <div class="content-grid">
    <section class="results-panel">
      <div class="results-head">
        <span>Résultats</span>
        <span><span class="results-count" id="resultsCount">0</span> joueur(s)</span>
      </div>
      <ul class="results-list" id="resultsList">
        <li><div class="empty-list">Importez un fichier pour commencer la recherche.</div></li>
      </ul>
    </section>

    <section class="detail-panel" id="detailPanel">
      <div class="detail-empty">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C10.5 2 9.6 3.6 10 5c.3 1 .2 1.6-.3 2.4C8.6 9 8 10.8 8 13c0 1.3.4 2 .4 3.2 0 1-.4 1.6-1 2.6-.5.9-.9 1.7-.9 2.6C6.5 22.8 8.4 23.5 12 23.5s5.5-.7 5.5-1.6c0-.9-.4-1.7-.9-2.6-.6-1-1-1.6-1-2.6 0-1.2.4-1.9.4-3.2 0-2.2-.6-4-1.7-5.6-.5-.8-.6-1.4-.3-2.4.4-1.4-.5-3-2-3Z" stroke="#8b92a8" stroke-width="1.4"/>
        </svg>
        <span>Sélectionnez un joueur dans la liste pour afficher ses informations.</span>
      </div>
    </section>
  </div>

</main>

<footer class="page-credit">Mis à disposition par Hugo Roos</footer>


<script>
(function(){
  let rows = [];
  let headers = [];
  let displayFields = [];
  let filtered = [];
  let selectedIndex = null;
  let compareMode = false;
  let compareIndex = null;
  let nameColKey = null, clubColKey = null, featureColKey = null, genreColKey = null;

  const EXCLUDED_HEADERS = ['(colonne E)', 'P', 'M', 'Nat', 'T/L'];
  const COMPARE_EXCLUDED_LABELS = ['N° de Licence', 'Numéro du club', 'Genre'];
  const SCORE_GROUPS = ['Scores C1 + C2', 'Scores Ligues', 'Scores Cumulés'];
  const HEADER_RENAMES = { 'LR': 'Région', 'dep': 'Département', 'Hand': 'Handicap', 'S': 'Genre', 'Cat': 'Catégorie', 'Moy': 'Moyenne', 'num': 'Numéro du club' };
  const REGION_DEP_LABEL = 'Région - Département';

  // Seuils de classement Elite / Excellence / Honneur d'après les règlements
  // fédéraux FFBSQ 2026 (moyennes maximum Honneur/Excellence, distinctes pour
  // les hommes et les femmes) : au-delà du plafond Excellence, un joueur est Elite.
  const CATEGORY_THRESHOLDS = {
    H: { honneurMax: 179, excellenceMax: 194 },
    F: { honneurMax: 164, excellenceMax: 179 }
  };

  function computeNiveau(row){
    if (!genreColKey || !featureColKey) return null;
    const genre = normalize(row[genreColKey]).charAt(0).toUpperCase();
    const moy = parseFloat(String(row[featureColKey]).replace(',', '.'));
    if (!CATEGORY_THRESHOLDS[genre] || isNaN(moy)) return null;
    const t = CATEGORY_THRESHOLDS[genre];
    if (moy <= t.honneurMax) return 'Honneur';
    if (moy <= t.excellenceMax) return 'Excellence';
    return 'Elite';
  }

  // Dépôt GitHub où sont déposés les fichiers "listing-aaaa-mm-jj*.xlsx",
  // à côté de ce index.html. À adapter avec votre compte / dépôt / dossier.
  const GITHUB_REPO = {
    owner: 'NoiceOS',
    name: 'Bowling-Listing',
    path: ''                        // dossier contenant les listings (laisser vide si à la racine)
  };

  let availableListings = [];

  const importBtn = document.getElementById('importBtn');
  const listingSelect = document.getElementById('listingSelect');
  const fileInput = document.getElementById('fileInput');
  const fileStatus = document.getElementById('fileStatus');
  const nameSearch = document.getElementById('nameSearch');
  const clubSearch = document.getElementById('clubSearch');
  const categorySearch = document.getElementById('categorySearch');
  const resetFiltersBtn = document.getElementById('resetFiltersBtn');
  const clubListEl = document.getElementById('clubList');
  const resultsList = document.getElementById('resultsList');
  const resultsCount = document.getElementById('resultsCount');
  const detailPanel = document.getElementById('detailPanel');

  const MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  function moisAnneeFromDateParts(year, month){
    const m = parseInt(month, 10);
    if (m >= 1 && m <= 12){
      const mois = MOIS_FR[m - 1];
      return mois.charAt(0).toUpperCase() + mois.slice(1) + ' ' + year;
    }
    return year;
  }

  importBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    fileStatus.textContent = 'Lecture de « ' + file.name + ' »…';
    fileStatus.className = 'file-status';

    const reader = new FileReader();
    reader.onload = (evt) => {
      processWorkbook(evt.target.result, file.name);
    };
    reader.onerror = () => {
      fileStatus.textContent = 'Erreur de lecture du fichier.';
      fileStatus.className = 'file-status err';
    };
    reader.readAsArrayBuffer(file);
  });

  // Recherche tous les fichiers "listing-aaaa-mm-jj*.xlsx" présents dans le
  // dépôt via l'API GitHub, peuple le menu déroulant, et charge automatiquement
  // le plus récent au chargement de la page.
  function discoverRepoListings(){
    const apiUrl = 'https://api.github.com/repos/' + GITHUB_REPO.owner + '/' + GITHUB_REPO.name + '/contents/' + GITHUB_REPO.path;

    fetch(apiUrl)
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(files => {
        const items = files
          .filter(f => f.type === 'file' && /^listing-(\d{4})-(\d{2})-(\d{2}).*\.xlsx$/i.test(f.name))
          .map(f => {
            const m = f.name.match(/^listing-(\d{4})-(\d{2})-(\d{2})/i);
            return {
              name: f.name,
              url: f.download_url,
              dateKey: m[1] + m[2] + m[3],
              label: moisAnneeFromDateParts(m[1], m[2])
            };
          })
          .sort((a, b) => b.dateKey.localeCompare(a.dateKey));

        if (!items.length) throw new Error('Aucun fichier listing-aaaa-mm-jj*.xlsx trouvé dans le dépôt.');

        availableListings = items;
        populateListingSelect(items);
        loadListingItem(items[0]);
      })
      .catch(err => {
        console.error(err);
        listingSelect.innerHTML = '<option value="">Dépôt indisponible</option>';
        listingSelect.disabled = true;
        fileStatus.textContent = 'Impossible de récupérer les listings du dépôt GitHub. Vérifiez GITHUB_REPO en haut du script, ou importez un fichier manuellement.';
        fileStatus.className = 'file-status err';
      });
  }

  function populateListingSelect(items){
    listingSelect.innerHTML = '';
    items.forEach((item, i) => {
      const opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = item.label + ' (' + item.name + ')';
      listingSelect.appendChild(opt);
    });
    listingSelect.disabled = false;
    listingSelect.value = '0';
  }

  listingSelect.addEventListener('change', () => {
    const item = availableListings[parseInt(listingSelect.value, 10)];
    if (item) loadListingItem(item);
  });

  function loadListingItem(item){
    fileStatus.textContent = 'Chargement du listing ' + item.label + '…';
    fileStatus.className = 'file-status';

    fetch(item.url)
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.arrayBuffer();
      })
      .then(buf => processWorkbook(buf, item.name, true, item.label))
      .catch(err => {
        console.error(err);
        fileStatus.textContent = 'Impossible de charger « ' + item.name + ' » depuis le dépôt.';
        fileStatus.className = 'file-status err';
      });
  }

  function processWorkbook(arrayBuffer, sourceName, isRepo, repoLabel){
    try {
      const data = new Uint8Array(arrayBuffer);
      const wb = XLSX.read(data, { type: 'array' });
      const sheetName = wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];

      // Lecture brute (tableau de tableaux) pour gérer nous-mêmes les
      // en-têtes groupées fusionnées ("Scores C1 + C2" sur 3 colonnes, etc.)
      const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      if (!raw.length) {
        fileStatus.textContent = 'Le fichier ne contient aucune ligne exploitable.';
        fileStatus.className = 'file-status err';
        return;
      }

      headers = buildHeaders(raw[0]);
      rows = raw.slice(1)
        .filter(r => r.some(v => String(v).trim() !== ''))
        .map(r => {
          const obj = {};
          headers.forEach((h, i) => { obj[h] = r[i] === undefined ? '' : r[i]; });
          return obj;
        });

      if (!rows.length) {
        fileStatus.textContent = 'Aucune ligne de données trouvée sous les en-têtes.';
        fileStatus.className = 'file-status err';
        return;
      }

      // Le vrai numéro de licence est la concaténation, séparée par un espace,
      // de "N° de Licence" et de la colonne sans en-tête qui la suit.
      rows.forEach(r => {
        const prefix = String(r['N° de Licence'] || '').trim();
        const suffix = String(r['(colonne E)'] || '').trim();
        r['N° de Licence'] = (prefix + ' ' + suffix).trim();
        delete r['(colonne E)'];
      });

      displayFields = buildDisplayFields(headers);

      autoDetectColumns();
      nameSearch.disabled = false;
      clubSearch.disabled = false;
      categorySearch.disabled = false;
      nameSearch.value = '';
      clubSearch.value = '';
      categorySearch.value = '';
      populateClubList();
      applyFilters();

      fileStatus.textContent = isRepo
        ? 'Listing chargé : ' + repoLabel + ' (' + sourceName + ') — ' + rows.length + ' joueur(s).'
        : '« ' + sourceName + ' » importé — ' + rows.length + ' joueur(s), feuille « ' + sheetName + ' ».';
      fileStatus.className = 'file-status ok';
    } catch (err) {
      console.error(err);
      fileStatus.textContent = 'Impossible de lire ce fichier. Vérifiez qu\'il s\'agit bien d\'un .xlsx / .csv valide.';
      fileStatus.className = 'file-status err';
    }
  }

  discoverRepoListings();

  function normalize(str){
    return String(str || '')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .trim();
  }

  function excelColLetter(idx){
    let s = '', n = idx;
    while (n >= 0){ s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; }
    return s;
  }

  // Construit des en-têtes uniques et lisibles à partir de la ligne brute,
  // en reconstituant les groupes fusionnés du type "Scores C1 + C2" qui
  // s'étendent sur 3 colonnes (Quilles / Parties / Moyenne) mais dont seule
  // la première cellule porte un texte dans le fichier source.
  function buildHeaders(headerRow){
    const subLabels = ['Quilles', 'Parties', 'Moyenne'];
    const out = [];
    const seen = {};
    let groupBase = null, groupPos = 0;

    headerRow.forEach((cell, i) => {
      const text = String(cell || '').trim();
      let label;

      if (text !== ''){
        if (/^scores/i.test(text)){
          groupBase = text; groupPos = 0;
          label = text + ' - ' + subLabels[0];
          groupPos = 1;
        } else {
          groupBase = null; groupPos = 0;
          label = HEADER_RENAMES[text] || text;
        }
      } else if (groupBase && groupPos < subLabels.length){
        label = groupBase + ' - ' + subLabels[groupPos];
        groupPos++;
      } else {
        groupBase = null;
        label = '(colonne ' + excelColLetter(i) + ')';
      }

      if (seen[label] !== undefined){
        seen[label]++;
        label = label + ' (' + seen[label] + ')';
      } else {
        seen[label] = 0;
      }
      out.push(label);
    });

    return out;
  }

  // Construit la liste ordonnée des champs à afficher dans la fiche joueur :
  // colonnes normales telles quelles, colonnes exclues retirées, et les 3
  // groupes "Scores ..." regroupés en une seule entrée (Quilles/Parties/Moyenne).
  function buildDisplayFields(headerList){
    const fields = [];
    const groupEmitted = {};
    let skipNext = null;

    headerList.forEach(h => {
      if (EXCLUDED_HEADERS.includes(h)) return;

      if (skipNext && h === skipNext){
        skipNext = null;
        return;
      }
      skipNext = null;

      if (h === 'Région'){
        fields.push({ type: 'pair', label: REGION_DEP_LABEL, keyA: 'Région', keyB: 'Département' });
        skipNext = 'Département';
        return;
      }

      const group = SCORE_GROUPS.find(g =>
        h === g + ' - Quilles' || h === g + ' - Parties' || h === g + ' - Moyenne'
      );

      if (group){
        if (!groupEmitted[group]){
          fields.push({
            type: 'group',
            label: group,
            quillesKey: group + ' - Quilles',
            partiesKey: group + ' - Parties',
            moyenneKey: group + ' - Moyenne'
          });
          groupEmitted[group] = true;
        }
        return;
      }

      fields.push({ type: 'single', label: h, key: h });
    });

    return fields;
  }

  function autoDetectColumns(){
    const nameCandidates = ['nom et prenom', 'nom prenom', 'nom', 'joueur', 'nom complet', 'licencie'];
    const clubCandidates = ['club'];
    const featureCandidates = ['moy', 'moyenne'];
    const genreCandidates = ['genre', 'sexe'];

    nameColKey = findBestHeader(nameCandidates) || headers[0];
    clubColKey = findBestHeader(clubCandidates) || headers[Math.min(1, headers.length - 1)];
    featureColKey = findBestHeader(featureCandidates) || '';
    genreColKey = findBestHeader(genreCandidates) || null;
  }

  function findBestHeader(candidates){
    for (const cand of candidates){
      const exact = headers.find(h => normalize(h) === cand);
      if (exact) return exact;
    }
    for (const cand of candidates){
      const partial = headers.find(h => normalize(h).includes(cand));
      if (partial) return partial;
    }
    return null;
  }

  function populateClubList(){
    clubListEl.innerHTML = '';
    if (!clubColKey) return;
    const clubs = [...new Set(rows.map(r => String(r[clubColKey] || '').trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'fr'));
    clubs.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      clubListEl.appendChild(opt);
    });
  }

  function applyFilters(){
    const nq = normalize(nameSearch.value);
    const cq = normalize(clubSearch.value);
    const catQuery = categorySearch.value;

    filtered = rows.filter((r, idx) => {
      const nameVal = normalize(nameColKey ? r[nameColKey] : '');
      const clubVal = normalize(clubColKey ? r[clubColKey] : '');
      const nameMatch = !nq || nameVal.includes(nq);
      const clubMatch = !cq || clubVal.includes(cq);
      const catMatch = !catQuery || computeNiveau(r) === catQuery;
      return nameMatch && clubMatch && catMatch;
    }).map((r, i) => ({ row: r, origIndex: rows.indexOf(r) }));

    renderResults();
  }

  function renderResults(){
    resultsCount.textContent = filtered.length;
    resultsList.innerHTML = '';

    if (!rows.length){
      resultsList.innerHTML = '<li><div class="empty-list">Importez un fichier pour commencer la recherche.</div></li>';
      return;
    }
    if (!filtered.length){
      resultsList.innerHTML = '<li><div class="empty-list">Aucun résultat pour cette recherche.</div></li>';
      return;
    }

    const capped = filtered.slice(0, 200);
    capped.forEach(item => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'result-btn' + (item.origIndex === selectedIndex ? ' active' : '');

      const name = nameColKey ? String(item.row[nameColKey] || '') : '';
      const club = clubColKey ? String(item.row[clubColKey] || '') : '';
      const initial = name.trim().charAt(0).toUpperCase() || '?';

      btn.innerHTML =
        '<span class="avatar">' + initial + '</span>' +
        '<span class="result-text">' +
          '<span class="result-name">' + escapeHtml(name || '(sans nom)') + '</span>' +
          '<span class="result-club">' + escapeHtml(club || '—') + '</span>' +
        '</span>';

      btn.addEventListener('click', () => {
        selectedIndex = item.origIndex;
        compareMode = false;
        compareIndex = null;
        renderResults();
        renderDetail();
      });

      li.appendChild(btn);
      resultsList.appendChild(li);
    });

    if (filtered.length > capped.length){
      const li = document.createElement('li');
      li.innerHTML = '<div class="empty-list">+ ' + (filtered.length - capped.length) + ' autre(s) résultat(s) — affinez votre recherche.</div>';
      resultsList.appendChild(li);
    }
  }

  function groupValues(row, field){
    const q = row[field.quillesKey], p = row[field.partiesKey], m = row[field.moyenneKey];
    const hasVal = v => v !== undefined && v !== null && String(v).trim() !== '';
    return {
      q: hasVal(q) ? q : null,
      p: hasVal(p) ? p : null,
      m: hasVal(m) ? m : null,
      has: hasVal(q) || hasVal(p) || hasVal(m)
    };
  }

  function playerHeader(row, avatarClass){
    const name = nameColKey ? String(row[nameColKey] || '(sans nom)') : '(sans nom)';
    const club = clubColKey ? String(row[clubColKey] || '—') : '—';
    const initial = name.trim().charAt(0).toUpperCase() || '?';
    return { name, club, initial };
  }

  function renderDetail(){
    if (selectedIndex === null || !rows[selectedIndex]){
      detailPanel.innerHTML =
        '<div class="detail-empty">' +
          '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C10.5 2 9.6 3.6 10 5c.3 1 .2 1.6-.3 2.4C8.6 9 8 10.8 8 13c0 1.3.4 2 .4 3.2 0 1-.4 1.6-1 2.6-.5.9-.9 1.7-.9 2.6C6.5 22.8 8.4 23.5 12 23.5s5.5-.7 5.5-1.6c0-.9-.4-1.7-.9-2.6-.6-1-1-1.6-1-2.6 0-1.2.4-1.9.4-3.2 0-2.2-.6-4-1.7-5.6-.5-.8-.6-1.4-.3-2.4.4-1.4-.5-3-2-3Z" stroke="#8b92a8" stroke-width="1.4"/></svg>' +
          '<span>Sélectionnez un joueur dans la liste pour afficher ses informations.</span>' +
        '</div>';
      return;
    }

    const row = rows[selectedIndex];

    // ----- Mode comparaison : deux joueurs choisis -----
    if (compareMode && compareIndex !== null && rows[compareIndex]){
      renderComparisonView(row, rows[compareIndex]);
      return;
    }

    // ----- Fiche joueur normale -----
    const { name, club, initial } = playerHeader(row);

    let html = '<div class="detail-header">' +
      '<span class="avatar-lg">' + initial + '</span>' +
      '<div><div class="detail-name">' + escapeHtml(name) + '</div>' +
      '<div class="detail-club">' + escapeHtml(club) + '</div></div>' +
    '</div>';

    html += '<div class="stat-grid">';
    displayFields.forEach(field => {
      if (field.type === 'pair'){
        const va = row[field.keyA], vb = row[field.keyB];
        const disp = v => (v === '' || v === undefined || v === null) ? '—' : String(v);
        html += '<div class="stat-row"><div class="k">' + escapeHtml(field.label) + '</div><div class="v">' + escapeHtml(disp(va) + ' - ' + disp(vb)) + '</div></div>';
        return;
      }

      if (field.type === 'single'){
        if (field.key === nameColKey || field.key === clubColKey) return;
        const val = row[field.key];
        const isFeature = field.key === featureColKey;
        let display = val === '' || val === undefined ? '—' : String(val);
        if (isFeature){
          const niveau = computeNiveau(row);
          if (niveau) display += ' · ' + niveau;
        }
        html += '<div class="stat-row"><div class="k">' + escapeHtml(field.label) + '</div><div class="v' + (isFeature ? ' v-featured' : '') + '">' + escapeHtml(display) + '</div></div>';
        return;
      }

      // field.type === 'group' : Quilles / Parties / Moyenne réunis dans la même case
      const g = groupValues(row, field);
      if (!g.has){
        html += '<div class="stat-row wide"><div class="k">' + escapeHtml(field.label) + '</div><div class="v">—</div></div>';
      } else {
        html += '<div class="stat-row wide"><div class="k">' + escapeHtml(field.label) + '</div>' +
          '<div class="mini-stats">' +
            '<div class="mini-stat"><span class="mk">Quilles</span><span class="mv">' + escapeHtml(g.q !== null ? String(g.q) : '—') + '</span></div>' +
            '<div class="mini-stat"><span class="mk">Parties</span><span class="mv">' + escapeHtml(g.p !== null ? String(g.p) : '—') + '</span></div>' +
            '<div class="mini-stat"><span class="mk">Moyenne</span><span class="mv">' + escapeHtml(g.m !== null ? String(g.m) : '—') + '</span></div>' +
          '</div></div>';
      }
    });

    html += '</div>';

    // ----- Zone comparaison (bouton, ou recherche du second joueur) -----
    if (!compareMode){
      html += '<div class="compare-toggle-row"><button class="link-btn" id="compareToggleBtn" type="button">⇄ Comparer à un autre joueur</button></div>';
    } else {
      html += '<div class="compare-panel">' +
        '<div class="compare-panel-head"><span>Choisir le second joueur</span><button class="link-btn" id="compareCancelBtn" type="button">Annuler</button></div>' +
        '<input type="text" id="compareSearchInput" class="compare-search-input" placeholder="Nom du joueur…" autocomplete="off">' +
        '<div class="compare-suggestions" id="compareSuggestions"></div>' +
      '</div>';
    }

    detailPanel.innerHTML = html;

    if (!compareMode){
      const toggleBtn = document.getElementById('compareToggleBtn');
      if (toggleBtn) toggleBtn.addEventListener('click', () => {
        compareMode = true;
        compareIndex = null;
        renderDetail();
      });
    } else {
      const cancelBtn = document.getElementById('compareCancelBtn');
      if (cancelBtn) cancelBtn.addEventListener('click', () => {
        compareMode = false;
        compareIndex = null;
        renderDetail();
      });

      const searchInput = document.getElementById('compareSearchInput');
      const suggestionsEl = document.getElementById('compareSuggestions');
      if (searchInput && suggestionsEl){
        searchInput.focus();
        const renderSuggestions = () => {
          const q = normalize(searchInput.value);
          suggestionsEl.innerHTML = '';
          if (!q){ return; }

          const matches = rows
            .map((r, idx) => ({ r, idx }))
            .filter(item => item.idx !== selectedIndex && nameColKey && normalize(item.r[nameColKey]).includes(q))
            .slice(0, 8);

          if (!matches.length){
            suggestionsEl.innerHTML = '<div class="suggestion-empty">Aucun joueur correspondant.</div>';
            return;
          }

          matches.forEach(item => {
            const n = nameColKey ? String(item.r[nameColKey] || '') : '';
            const c = clubColKey ? String(item.r[clubColKey] || '') : '';
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'suggestion-btn';
            b.innerHTML = '<span class="suggestion-name">' + escapeHtml(n || '(sans nom)') + '</span><span class="suggestion-club">' + escapeHtml(c || '—') + '</span>';
            b.addEventListener('click', () => {
              compareIndex = item.idx;
              renderDetail();
            });
            suggestionsEl.appendChild(b);
          });
        };
        searchInput.addEventListener('input', renderSuggestions);
      }
    }
  }

  function renderComparisonView(rowA, rowB){
    const a = playerHeader(rowA);
    const b = playerHeader(rowB);

    // Éclate les groupes "Scores ..." en une ligne par donnée (Quilles / Parties /
    // Moyenne) pour permettre une comparaison strictement donnée à donnée.
    const compareFields = [];
    displayFields.forEach(field => {
      if (field.type === 'pair'){
        compareFields.push({ label: 'Région', key: field.keyA });
        compareFields.push({ label: 'Département', key: field.keyB });
        return;
      }
      if (field.type === 'single'){
        if (field.key === nameColKey || field.key === clubColKey) return;
        if (COMPARE_EXCLUDED_LABELS.includes(field.label)) return;
        compareFields.push({ label: field.label, key: field.key, highlight: field.key === featureColKey });
        return;
      }
      compareFields.push({ label: field.label + ' · Quilles', key: field.quillesKey });
      compareFields.push({ label: field.label + ' · Parties', key: field.partiesKey });
      compareFields.push({ label: field.label + ' · Moyenne', key: field.moyenneKey, highlight: true });
    });
    compareFields.push({ label: 'Niveau', key: '__niveau__', highlight: true });

    let html = '<div class="compare-players">' +
      '<div class="compare-player"><span class="avatar-lg">' + a.initial + '</span><div><div class="detail-name">' + escapeHtml(a.name) + '</div><div class="detail-club">' + escapeHtml(a.club) + '</div></div></div>' +
      '<span class="compare-vs">VS</span>' +
      '<div class="compare-player"><span class="avatar-lg">' + b.initial + '</span><div><div class="detail-name">' + escapeHtml(b.name) + '</div><div class="detail-club">' + escapeHtml(b.club) + '</div></div></div>' +
    '</div>';

    const disp = v => (v === '' || v === undefined || v === null) ? '—' : String(v);

    html += '<div class="compare-table-scroll"><table class="compare-table"><tbody>';
    compareFields.forEach(field => {
      const va = field.key === '__niveau__' ? computeNiveau(rowA) : rowA[field.key];
      const vb = field.key === '__niveau__' ? computeNiveau(rowB) : rowB[field.key];
      html += '<tr' + (field.highlight ? ' class="compare-highlight"' : '') + '>' +
        '<td class="ck">' + escapeHtml(field.label) + '</td>' +
        '<td class="cv">' + escapeHtml(disp(va)) + '</td>' +
        '<td class="cv">' + escapeHtml(disp(vb)) + '</td>' +
      '</tr>';
    });
    html += '</tbody></table></div>';

    html += '<div class="compare-actions">' +
      '<button class="link-btn" id="compareChangeBtn" type="button">Changer de joueur</button>' +
      '<button class="link-btn" id="compareExitBtn" type="button">Quitter la comparaison</button>' +
    '</div>';

    detailPanel.innerHTML = html;

    const changeBtn = document.getElementById('compareChangeBtn');
    if (changeBtn) changeBtn.addEventListener('click', () => {
      compareIndex = null;
      renderDetail();
    });
    const exitBtn = document.getElementById('compareExitBtn');
    if (exitBtn) exitBtn.addEventListener('click', () => {
      compareMode = false;
      compareIndex = null;
      renderDetail();
    });
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  nameSearch.addEventListener('input', applyFilters);
  clubSearch.addEventListener('input', applyFilters);
  categorySearch.addEventListener('change', applyFilters);
  resetFiltersBtn.addEventListener('click', () => {
    nameSearch.value = '';
    clubSearch.value = '';
    categorySearch.value = '';
    applyFilters();
  });
})();
</script>
